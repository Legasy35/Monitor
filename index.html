<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centinela RSS — Monitor de noticias</title>
<style>
  :root{
    --ink:#111111;
    --ink-soft:#6b6b6b;
    --ink-faint:#9a9a9a;
    --rule:#d9d9d9;
    --lilac:#8e7cc3;
    --page-bg:#f5f5f7;
    --card-bg:#ffffff;
    --radius:16px;
    --radius-sm:10px;
    --radius-pill:999px;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.06);
    --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .masthead{
    width:100%;
    max-width:1400px;
    margin:0 auto;
    padding:32px clamp(16px, 5vw, 20px) 20px;
    text-align:left;
    background:transparent;
  }
  .masthead .kicker{
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:700;
    margin-bottom:6px;
  }
  .masthead h1{
    font-weight:700;
    font-size:clamp(30px, 6vw, 46px);
    margin:0;
    letter-spacing:-0.02em;
  }
  .rss-word{
    display:inline-flex;
    align-items:baseline;
    gap:0.1em;
  }
  .rss-icon{
    flex-shrink:0;
  }
  .masthead .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:8px;
    font-style:normal;
  }
  .toolbar{
    width:100%;
    max-width:1400px;
    margin:0 auto;
    padding:20px clamp(16px, 5vw, 20px) 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .status{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .status strong{color:var(--ink);}
  button#refresh-all{
    background:var(--ink);
    color:#fff;
    border:none;
    padding:10px 20px;
    font-weight:700;
    font-size:13.5px;
    letter-spacing:.03em;
    cursor:pointer;
    border-radius:var(--radius-pill);
    transition:opacity .15s ease;
  }
  button#refresh-all:hover{opacity:.8;}
  button#refresh-all:disabled{background:var(--ink-faint); cursor:default;}

  main{
    width:100%;
    max-width:1400px;
    margin:0 auto;
    padding:0 clamp(16px, 5vw, 20px) 60px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .outlet{
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px 20px;
  }
  .outlet-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    cursor:pointer;
    user-select:none;
  }
  .outlet-name{
    font-weight:600;
    font-size:20px;
  }
  .outlet-meta{
    font-size:11.5px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .state-text{font-weight:400;}
  .state-text.ok{font-weight:700; color:var(--ink);}
  .state-text.err{font-weight:700; font-style:italic;}

  .items{
    margin-top:10px;
    display:grid;
    gap:0;
  }
  .group-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:18px 0 4px;
  }
  .group-label:first-child{margin-top:0;}
  .item{
    padding:12px 0;
    border-bottom:1px solid #efefef;
  }
  .item:last-child{border-bottom:none;}
  .item-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .item-thumb{
    width:44px;
    height:44px;
    background:#e4e4e4;
    flex-shrink:0;
    overflow:hidden;
    border-radius:var(--radius-sm);
  }
  .item-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .item-title-wrap{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .item-title{
    font-family:inherit;
    background:none;
    border:none;
    padding:0;
    text-align:left;
    color:var(--ink);
    font-weight:600;
    font-size:15px;
    line-height:1.3;
    cursor:pointer;
    flex:1;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item.expanded .item-title{white-space:normal;}
  .item-title:hover{text-decoration:underline;}
  .item-openlink{
    flex-shrink:0;
    color:var(--ink-soft);
    text-decoration:none;
    font-size:13px;
  }
  .item-openlink:hover{color:var(--ink);}
  .item-side{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .item time{
    font-size:11px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .item-desc{
    flex-basis:100%;
    width:100%;
    margin:8px 0 0 56px;
    font-size:13.5px;
    font-weight:400;
    line-height:1.5;
    color:var(--ink-soft);
    display:none;
  }
  .item.expanded .item-desc{display:block;}
  .copy-btn{
    font-family:inherit;
    font-size:10.5px;
    font-weight:600;
    background:#fff;
    border:1px solid var(--rule);
    border-radius:var(--radius-pill);
    color:var(--ink-soft);
    padding:4px 10px;
    cursor:pointer;
    white-space:nowrap;
  }
  .copy-btn:hover{border-color:var(--ink); color:var(--ink);}
  .copy-btn.copied{border-color:var(--ink); color:var(--ink); font-weight:700;}
  .copy-img-btn{
    font-family:inherit;
    font-size:10.5px;
    font-weight:600;
    background:#fff;
    border:1px solid var(--rule);
    border-radius:var(--radius-pill);
    color:var(--ink-soft);
    padding:4px 10px;
    cursor:pointer;
    white-space:nowrap;
  }
  .copy-img-btn:hover{border-color:var(--ink); color:var(--ink);}
  .copy-img-btn.copied{border-color:var(--ink); color:var(--ink); font-weight:700;}
  .empty, .loading, .error-msg{
    font-size:13.5px;
    color:var(--ink-soft);
    padding:8px 0;
    font-style:italic;
  }
  .error-msg a{color:var(--ink); font-style:normal; font-weight:700;}

  .collapsed .items{display:none;}
  .chev{transition:transform .15s ease; display:inline-block;}
  .collapsed .chev{transform:rotate(-90deg);}

  footer{
    width:100%;
    max-width:1400px;
    margin:0 auto;
    padding:0 clamp(16px, 5vw, 20px) 40px;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  footer a{color:var(--ink-soft);}

  @media (max-width:700px){
    .item-desc{margin-left:0;}
  }

  @media (max-width:520px){
    .toolbar{flex-direction:column; align-items:stretch;}
    button#refresh-all{width:100%;}
    .status{order:1;}
    .outlet-name{font-size:18px;}
  }

  .events-strip{
    width:100%;
    max-width:1400px;
    margin:0 auto 14px;
    padding:20px 20px 18px;
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .events-strip-title{
    font-size:10px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .events-strip-note{
    font-size:10px;
    color:var(--ink-faint);
    margin-top:6px;
    display:block;
  }
  .events-strip-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }

  .cat-toggles{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .cat-toggle-btn{
    font-family:inherit;
    font-size:11.5px;
    font-weight:600;
    background:#fff;
    border:1px solid var(--rule);
    border-radius:var(--radius-pill);
    color:var(--ink-soft);
    padding:5px 12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    opacity:.45;
  }
  .cat-toggle-btn .sw{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .cat-toggle-btn.on{opacity:1; border-color:var(--ink-faint); color:var(--ink);}
  .cat-curves-wrap{width:100%; line-height:0; margin-bottom:14px;}
  .cat-curves-wrap svg{width:100%; height:auto; display:block;}

  .cal-today-btn{
    font-family:inherit;
    font-size:11px;
    font-weight:600;
    background:#fff;
    border:1px solid var(--rule);
    border-radius:var(--radius-pill);
    color:var(--ink-soft);
    padding:5px 12px;
    cursor:pointer;
    margin-left:auto;
  }
  .cal-today-btn:hover{border-color:var(--ink); color:var(--ink);}

  .cal-months-row{
    display:flex;
    gap:4px;
    margin-bottom:10px;
  }
  .cal-month-btn{
    font-family:inherit;
    flex:1;
    background:#fff;
    border:1px solid var(--rule);
    border-radius:var(--radius-sm);
    color:var(--ink-soft);
    font-size:11px;
    font-weight:600;
    padding:7px 2px;
    cursor:pointer;
  }
  .cal-month-btn:hover{border-color:var(--ink); color:var(--ink);}
  .cal-month-btn.active{background:var(--ink); border-color:var(--ink); color:#fff; font-weight:700;}
  .cal-month-btn:disabled{opacity:.3; cursor:default;}

  .cal-grid{
    display:flex;
    gap:3px;
    margin-bottom:10px;
  }
  .cal-day{
    font-family:inherit;
    background:#fff;
    border:1px solid var(--rule);
    border-radius:var(--radius-sm);
    color:var(--ink);
    flex:1 1 0;
    min-width:0;
    padding:5px 2px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    cursor:pointer;
    text-align:center;
  }
  .cal-day:hover{border-color:var(--ink);}
  .cal-day .day-wd{font-size:8px; font-weight:700; letter-spacing:.02em; color:var(--ink-soft); text-transform:uppercase;}
  .cal-day .day-num{font-size:13px; font-weight:600;}
  .cal-day.today{border-color:var(--ink); border-width:2px;}
  .cal-day.today .day-num{font-weight:800;}
  .cal-day.selected{background:#ececec; border-color:var(--ink); border-width:2px;}
  .day-badge{
    font-size:9.5px;
    font-weight:700;
    color:#fff;
    background:var(--ink);
    width:15px;
    height:15px;
    line-height:15px;
    border-radius:50%;
  }

  @media (max-width:700px){
    .cal-day .day-wd{display:none;}
    .cal-day .day-num{font-size:11px;}
    .day-badge{width:13px; height:13px; line-height:13px; font-size:8.5px;}
  }

  .events-list-hint{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:600;
    margin:0 0 4px;
  }
  .events-list{
    margin-top:12px;
    display:grid;

    gap:0;
  }
  .event-row{
    display:grid;
    grid-template-columns:130px minmax(160px,1fr) auto;
    gap:14px;
    align-items:baseline;
    padding:8px 0;
    border-bottom:1px solid #efefef;
  }
  .event-row:last-child{border-bottom:none;}
  .event-date{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:600;
    white-space:nowrap;
  }
  .event-title{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    text-decoration:none;
  }
  .event-title:hover{font-weight:700; text-decoration:underline;}
  .event-venue{
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }

  @media (max-width:700px){
    .event-row{grid-template-columns:1fr; gap:2px;}
    .event-venue{text-align:left;}
  }

  .filters-bar{
    width:100%;
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    border-top:1px solid var(--rule);
  }
  .filter-group{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .filter-group label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-soft);
  }
  .search-row{
    width:100%;
    padding:14px 20px 18px;
    border-top:1px solid var(--rule);
  }
  .filter-search{
    font-family:inherit;
    font-size:13px;
    border:1px solid var(--rule);
    border-radius:var(--radius-sm);
    padding:8px 12px;
    width:280px;
    max-width:100%;
    background:#fff;
    color:var(--ink);
  }
  .filter-search:focus{outline:none; border-color:var(--ink);}
  .filters-bar select{
    font-family:inherit;
    font-size:13px;
    border:1px solid var(--rule);
    border-radius:var(--radius-sm);
    padding:7px 10px;
    background:#fff;
    color:var(--ink);
  }
  .filter-toggle{
    font-family:inherit;
    font-size:12.5px;
    font-weight:600;
    background:#fff;
    color:var(--ink);
    border:1px solid var(--ink);
    border-radius:var(--radius-pill);
    padding:7px 14px;
    cursor:pointer;
  }
  .filter-toggle.active{
    background:var(--ink);
    color:#fff;
  }
  .controls-card{
    width:100%;
    max-width:1400px;
    margin:0 auto 14px;
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .outlet-toggles{
    width:100%;
    padding:18px 20px 16px;
  }
  .outlet-toggles-title{
    font-size:15px;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--ink);
    margin-bottom:8px;
  }
  .outlet-checklist{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-wrap:wrap;
    gap:8px 22px;
  }
  .outlet-checklist li{
    display:flex;
    align-items:center;
    gap:7px;
  }
  .outlet-checklist input[type="checkbox"]{
    width:14px;
    height:14px;
    accent-color:var(--ink);
    cursor:pointer;
  }
  .outlet-checklist label{
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
  }
  .outlet.hidden-by-filter{display:none;}

  @media (max-width:520px){
    .filters-bar{gap:12px 16px;}
    .filter-search{width:100%;}
    .filter-group{width:100%;}
  }

</style>
</head>
<body>

<div class="toolbar">
  <div class="status" id="status">Tocá "Actualizar noticias" para traer lo último.</div>
  <button id="refresh-all">Actualizar noticias</button>
</div>

<div class="masthead">
  <h1>Centinela <span class="rss-word">RSS<svg class="rss-icon" viewBox="0 0 24 24" width="0.72em" height="0.72em" aria-hidden="true"><circle cx="5" cy="19" r="2.4" fill="currentColor"/><path d="M4 11.5C10.9 11.5 16.5 17.1 16.5 24" stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" transform="translate(0,-4)"/><path d="M4 4.5C14.5 4.5 23 13 23 23.5" stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" transform="translate(0,-4)"/></svg></span></h1>
</div>

<div class="events-strip">
  <div class="events-strip-head">
    <span class="events-strip-title">Agenda de eventos</span>
  </div>

  <div class="cat-toggles" id="cat-toggles"></div>
  <div class="cal-months-row" id="cal-months-row"></div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="cat-curves-wrap"><div class="cat-curves" id="cat-curves"></div></div>

  <p class="events-list-hint" id="events-hint"></p>
  <div class="events-list" id="events-list"></div>
  <div class="events-strip-note">eventos cargados a mano · asuncion.live · disfrutandoparaguay.com</div>
</div>

<div class="controls-card">
  <div class="outlet-toggles" id="outlet-toggles">
    <div class="outlet-toggles-title">Medios</div>
    <ul class="outlet-checklist" id="outlet-checklist"></ul>
  </div>

  <div class="filters-bar">
    <div class="filter-group">
      <label for="filter-freshness">Antigüedad</label>
      <select id="filter-freshness">
        <option value="all">Todas</option>
        <option value="15m">Últimos 15 min</option>
        <option value="30m">Últimos 30 min</option>
        <option value="1h">Última hora</option>
        <option value="3h">Últimas 3 hs</option>
        <option value="6h">Últimas 6 hs</option>
        <option value="today">Hoy</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-quantity">Cantidad</label>
      <select id="filter-quantity">
        <option value="3">3</option>
        <option value="5" selected>5</option>
        <option value="10">10</option>
      </select>
    </div>
    <button id="filter-latest-only" class="filter-toggle" type="button">Solo la última por sección</button>
  </div>

  <div class="search-row">
    <input type="text" id="filter-search" class="filter-search" placeholder="Buscar por palabra clave…">
  </div>
</div>

<main id="outlets"></main>

<script>
// ---- Fuentes ----
// Cada medio puede tener 1 o más feeds RSS. Se listan combinados bajo el nombre del medio.
const OUTLETS = [

  {

    groups: [{ url: "https://noticiascde.com.py/feed/" }]

  {

    groups: [

      { label: "Objeciones", url: "https://silpy.congreso.gov.py/web/FeedRss?opcionRSS=3" }
    ]
  },

  // --- X (Twitter) vía RSS.app ---
  // 1. Entrá a rss.app, generá el feed de la cuenta/lista/hashtag que quieras seguir.
  // 2. Copiá la URL que te da (algo como "https://rss.app/feeds/xxxxxxxx.xml").

  //   name: "X — Cuentas verificadas",
  //   site: "https://x.com",
  //   groups: [{ url: "https://rss.app/feeds/TU_ID_AQUI.xml" }]
  // }

];

const MAX_ITEMS_PER_GROUP = 10; // techo absoluto pedido a cada feed
const statusEl = document.getElementById("status");
const outletsEl = document.getElementById("outlets");
const refreshBtn = document.getElementById("refresh-all");
const searchInput = document.getElementById("filter-search");
const freshnessSelect = document.getElementById("filter-freshness");
const quantitySelect = document.getElementById("filter-quantity");
const latestOnlyBtn = document.getElementById("filter-latest-only");
const outletTogglesEl = document.getElementById("outlet-toggles");

const outletCache = new Map(); // outlet.name -> { anyOk, updatedLabel, results:[{group, items}] }
const hiddenOutlets = new Set();
const filters = { search: "", freshness: "all", quantity: 5, latestOnly: false };

function fmtTime(dateStr){
  const d = new Date(dateStr);
  if (isNaN(d)) return "";
  return d.toLocaleString("es-PY", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
}

function stripAccents(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function cleanDescription(html){
  if (!html) return "";
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  return (tmp.textContent || tmp.innerText || "").replace(/\s+/g, " ").trim();
}

// Igual que cleanDescription, pero conserva los saltos de párrafo (para el texto que se copia)
function cleanDescriptionParagraphs(html){
  if (!html) return "";
  const withBreaks = html.replace(/<\/p>|<br\s*\/?>/gi, "\n\n");
  const tmp = document.createElement("div");
  tmp.innerHTML = withBreaks;
  const raw = tmp.textContent || tmp.innerText || "";
  return raw
    .split(/\n{2,}/)
    .map(p => p.replace(/\s+/g, " ").trim())
    .filter(Boolean)
    .join("\n\n");
}

function buildOutletCard(outlet){
  const card = document.createElement("section");
  card.className = "outlet";
  card.id = "outlet-" + outlet.name.replace(/\s+/g, "-");
  card.innerHTML = `
    <div class="outlet-head">
      <div>
        <span class="chev">▾</span>
        <span class="outlet-name">${outlet.name}</span>
      </div>
      <div class="outlet-meta">
        <span class="state-text">esperando actualización</span>
        <a href="${outlet.site}" target="_blank" rel="noopener">abrir el sitio ↗</a>
      </div>
    </div>
    <div class="items"><div class="loading">Sin cargar todavía.</div></div>
  `;
  card.querySelector(".outlet-head").addEventListener("click", () => {
    card.classList.toggle("collapsed");
  });
  return card;
}

async function fetchFeed(url){
  const api = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url) + "&count=" + MAX_ITEMS_PER_GROUP;
  const res = await fetch(api);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if (data.status !== "ok") throw new Error(data.message || "feed inválido");
  return data.items || [];
}

// Trae y ordena los datos crudos de un medio, sin tocar el DOM todavía.
async function fetchOutletData(outlet){
  const results = await Promise.all(outlet.groups.map(async g => {
    try{
      const items = await fetchFeed(g.url);
      items.sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
      return { group: g, items, ok: true };
    }catch(e){
      return { group: g, items: [], ok: false };
    }
  }));
  const anyOk = results.some(r => r.ok);
  outletCache.set(outlet.name, {
    anyOk,
    updatedLabel: "actualizado " + new Date().toLocaleTimeString("es-PY", {hour:"2-digit", minute:"2-digit"}),
    results
  });
}

function itemMatchesFilters(it){
  if (filters.freshness !== "all"){
    const d = new Date(it.pubDate);
    if (isNaN(d)) return false;
    const now = new Date();
    let cutoff;
    if (filters.freshness === "15m") cutoff = new Date(now - 15*60*1000);
    else if (filters.freshness === "30m") cutoff = new Date(now - 30*60*1000);
    else if (filters.freshness === "1h") cutoff = new Date(now - 60*60*1000);
    else if (filters.freshness === "3h") cutoff = new Date(now - 3*60*60*1000);
    else if (filters.freshness === "6h") cutoff = new Date(now - 6*60*60*1000);
    else if (filters.freshness === "today") cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (d < cutoff) return false;
  }
  if (filters.search){
    const needle = stripAccents(filters.search.toLowerCase());
    const haystack = stripAccents((it.title + " " + cleanDescription(bestRawDescription(it))).toLowerCase());
    if (!haystack.includes(needle)) return false;
  }
  return true;
}

function fmtDateForShare(dateStr){
  const d = new Date(dateStr);
  if (isNaN(d)) return "";
  const months = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
  return `${String(d.getDate()).padStart(2,"0")}/${months[d.getMonth()]}/${d.getFullYear()}`;
}

function escapeHTML(s){
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Algunos feeds mandan el resumen corto en "description" y el texto completo en "content" (o al revés).
// Usamos el que tenga más texto real, para no perder contenido.
function bestRawDescription(it){
  const d = it.description || "";
  const c = it.content || "";
  return cleanDescription(c).length > cleanDescription(d).length ? c : d;
}

// Recorta un texto a maxLen caracteres, cortando en el último espacio (no a mitad de palabra).
// No es un resumen inteligente — solo un recorte prolijo a un largo fijo.
function shortTopic(text, maxLen){
  if (text.length <= maxLen) return text;
  const cut = text.slice(0, maxLen);
  const lastSpace = cut.lastIndexOf(" ");
  return (lastSpace > maxLen * 0.5 ? cut.slice(0, lastSpace) : cut).trim() + "…";
}

function buildItemRow(it, outletName){
  const rawDesc = bestRawDescription(it);
  const desc = cleanDescription(rawDesc);
  const thumbUrl = it.thumbnail || it.enclosure?.link || "";

  // En SILpy el título del feed es solo "Expediente D-XXXXX", que no dice nada por sí solo.
  // El texto que sí identifica de qué trata viene en la descripción — le agregamos una versión
  // corta (no es un resumen "inteligente", es un recorte prolijo a un largo fijo).
  let displayTitle = it.title;
  if (outletName === "Congreso Nacional (SILpy)" && desc){
    displayTitle = `${it.title} — ${shortTopic(desc, 80)}`;
  }

  const row = document.createElement("div");
  row.className = "item";
  row.innerHTML = `
    <div class="item-row">
      <div class="item-thumb">${thumbUrl ? `<img src="${thumbUrl}" alt="" loading="lazy" onerror="this.parentElement.innerHTML=''">` : ""}</div>
      <div class="item-title-wrap">
        <button type="button" class="item-title">${escapeHTML(displayTitle)}</button>
        <a class="item-openlink" href="${it.link}" target="_blank" rel="noopener" title="Abrir la nota original">↗</a>
      </div>
      <div class="item-side">
        <time class="item-time">${fmtTime(it.pubDate)}</time>
        <button type="button" class="copy-btn" title="Copiar formateado para WhatsApp">Copiar</button>
        ${thumbUrl ? `<button type="button" class="copy-img-btn" title="Copiar la imagen">Copiar imagen</button>` : ""}
      </div>
      <p class="item-desc">${escapeHTML(desc) || "Este medio no envía resumen para esta noticia — usá el ↗ para leerla completa."}</p>
    </div>
  `;
  row.querySelector(".item-title").addEventListener("click", () => {
    row.classList.toggle("expanded");
  });
  row.querySelector(".copy-btn").addEventListener("click", (ev) => {
    const btn = ev.currentTarget;
    const descParagraphs = cleanDescriptionParagraphs(rawDesc);
    const text = `*${fmtDateForShare(it.pubDate)}*\n\n*${it.title}*\n\n${descParagraphs}`;
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.textContent;
      btn.textContent = "¡Copiado!";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = original; btn.classList.remove("copied"); }, 1500);
    });
  });
  const copyImgBtn = row.querySelector(".copy-img-btn");
  if (copyImgBtn){
    copyImgBtn.addEventListener("click", (ev) => {
      const btn = ev.currentTarget;
      const original = btn.textContent;

      // Traer la imagen (proxy con CORS, con reintento directo como respaldo)
      async function fetchImageBlob(){
        try{
          const proxyUrl = "https://images.weserv.nl/?url=" + encodeURIComponent(thumbUrl.replace(/^https?:\/\//, "")) + "&output=png";
          const res = await fetch(proxyUrl);
          if (!res.ok) throw new Error("proxy falló");
          return await res.blob();
        }catch(proxyErr){
          const res = await fetch(thumbUrl, { mode: "cors" });
          const raw = await res.blob();
          return raw.type === "image/png" ? raw : await blobToPng(raw);
        }
      }

      // clipboard.write() se llama YA, en el mismo instante del click (ClipboardItem acepta
      // una promesa como valor) — si esperáramos a que termine el fetch antes de llamarlo,
      // el navegador considera que ya pasó demasiado tiempo desde el click y bloquea el permiso.
      const writePromise = navigator.clipboard.write([
        new ClipboardItem({ "image/png": fetchImageBlob() })
      ]);

      writePromise.then(() => {
        btn.textContent = "¡Copiada!";
        btn.classList.add("copied");
      }).catch(() => {
        btn.textContent = "No se pudo copiar";
      }).finally(() => {
        setTimeout(() => { btn.textContent = original; btn.classList.remove("copied"); }, 1800);
      });
    });
  }
  return row;
}

// Convierte un blob de imagen (jpeg/webp/etc) a PNG, único formato que acepta el portapapeles
function blobToPng(blob){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext("2d").drawImage(img, 0, 0);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error("sin blob")), "image/png");
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(blob);
  });
}

// Re-dibuja un medio a partir de lo que ya está en caché, aplicando filtros. No hace red.
function renderOutletCard(outlet, card){
  const cache = outletCache.get(outlet.name);
  const stateText = card.querySelector(".state-text");
  const itemsEl = card.querySelector(".items");
  if (!cache) return;

  if (!cache.anyOk){
    stateText.className = "state-text err";
    stateText.textContent = "no se pudo cargar";
    itemsEl.innerHTML = `<div class="error-msg">No se pudo traer este feed ahora.
      <a href="${outlet.site}" target="_blank" rel="noopener">Abrir ${outlet.name} directamente ↗</a></div>`;
    return;
  }

  stateText.className = "state-text ok";
  stateText.textContent = cache.updatedLabel;

  const showLabels = outlet.groups.length > 1;
  const limit = filters.latestOnly ? 1 : (filters.quantity === "all" ? Infinity : filters.quantity);
  itemsEl.innerHTML = "";
  let anyRendered = false;

  cache.results.forEach(({group, items, ok}) => {
    const filteredItems = items.filter(itemMatchesFilters);
    const toShow = filteredItems.slice(0, limit);

    if (showLabels){
      const h = document.createElement("div");
      h.className = "group-label";
      let suffix = "";
      if (!ok) suffix = " · no disponible";
      else if (items.length === 0) suffix = " · sin novedades";
      else if (toShow.length === 0) suffix = " · sin resultados con estos filtros";
      h.textContent = group.label + suffix;
      itemsEl.appendChild(h);
    }

    toShow.forEach(it => { itemsEl.appendChild(buildItemRow(it, outlet.name)); anyRendered = true; });
  });

  if (!anyRendered && !showLabels){
    itemsEl.innerHTML = `<div class="empty">Sin noticias que coincidan con estos filtros.</div>`;
  }
}

// Convierte una lista de puntos [x,y] en un path SVG suavizado (Catmull-Rom -> Bézier)
function smoothPath(pts){
  if (pts.length < 3) return "M" + pts.map(p => p.join(",")).join(" L");
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i === 0 ? 0 : i - 1];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2 < pts.length ? i + 2 : i + 1];
    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

  const grid = document.getElementById("cal-grid");
  grid.innerHTML = "";
  const todayStr = todayISO();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const WD = ["LUN","MAR","MIÉ","JUE","VIE","SÁB","DOM"];

  for (let dayNum = 1; dayNum <= daysInMonth; dayNum++){
    const d = new Date(year, month, dayNum);
    const iso = isoOf(d);
    const count = countOn(iso);
    const cell = document.createElement("button");
    cell.type = "button";
    cell.className = "cal-day"
      + (iso === todayStr ? " today" : "")
      + (iso === eventsSelected ? " selected" : "");
    const wd = WD[(d.getDay() + 6) % 7];
    cell.innerHTML = `<span class="day-wd">${wd}</span><span class="day-num">${dayNum}</span>${count ? `<span class="day-badge">${count}</span>` : ""}`;
    cell.addEventListener("click", () => {
      eventsSelected = (eventsSelected === iso) ? null : iso;
      renderMonthCalendar();
      renderEventsList();
    });
    grid.appendChild(cell);
  }

  renderCatCurves();
}

const EVENTS_PREVIEW_COUNT = 5;
let eventsShowAll = false;

function renderEventsList(){
  const listEl = document.getElementById("events-list");
  const hintEl = document.getElementById("events-hint");
  const today = todayISO();
  const upcoming = EVENTS.filter(e => e.end >= today).sort((a,b) => a.start.localeCompare(b.start));

  let items, hintHTML;
  if (eventsSelected){
    items = EVENTS.filter(e => e.start <= eventsSelected && e.end >= eventsSelected)
      .sort((a,b) => a.start.localeCompare(b.start));
    hintHTML = `${dLabel(eventsSelected,{day:"2-digit",month:"long"})} · <a href="#" id="events-clear" style="color:inherit">ver todos</a>`;
  } else if (eventsShowAll){
    items = upcoming;
    hintHTML = `Todos los eventos (${upcoming.length}) · <a href="#" id="events-clear" style="color:inherit">ver menos</a>`;
  } else {
    items = upcoming.slice(0, EVENTS_PREVIEW_COUNT);
    hintHTML = upcoming.length > EVENTS_PREVIEW_COUNT
      ? `Próximos eventos · <a href="#" id="events-clear" style="color:inherit">ver todos (${upcoming.length})</a>`
      : "Próximos eventos";
  }
  hintEl.innerHTML = hintHTML;
  const clearLink = document.getElementById("events-clear");
  if (clearLink) clearLink.addEventListener("click", (ev) => {
    ev.preventDefault();
    if (eventsSelected){
      eventsSelected = null;
    } else {
      eventsShowAll = !eventsShowAll;
    }
    renderMonthCalendar();
    renderEventsList();
  });

  listEl.innerHTML = "";
  if (!items.length){
    listEl.innerHTML = `<div class="empty">Sin eventos para esta fecha.</div>`;
    return;
  }
  items.forEach(e => {
    const dateLabel = e.start === e.end
      ? dLabel(e.start, {day:"2-digit", month:"short"})
      : `${dLabel(e.start, {day:"2-digit", month:"short"})}–${dLabel(e.end, {day:"2-digit", month:"short"})}`;
    const row = document.createElement("div");
    row.className = "event-row";
    row.innerHTML = `
      <div class="event-date">${dateLabel}${e.time ? " · " + e.time : ""}</div>
      <a class="event-title" href="${e.link}" target="_blank" rel="noopener">${e.title}</a>
      <div class="event-venue">${e.venue}${e.free ? " · Gratuito" : ""}</div>
    `;
    listEl.appendChild(row);
  });
}

renderEventsList();

// Colores bien tenues y apagados, muy poco saturados, para que las curvas superpuestas no compitan entre sí
const CATEGORIES = [
  { key:"conciertos", label:"Conciertos", color:"#8a95a6" },
  { key:"cultural",   label:"Cultural",   color:"#9aa88e" },
  { key:"ferias",     label:"Ferias",     color:"#b3a184" },
  { key:"clima",      label:"Clima",      color:"#84a3ad" }
];
const catActive = new Set(CATEGORIES.map(c => c.key));
let weatherData = null; // { dates:[...], max:[...], min:[...] } — pronóstico real, solo próx. ~16 días

async function loadWeather(){
  try{
    const url = "https://api.open-meteo.com/v1/forecast?latitude=-25.2637&longitude=-57.5759"
      + "&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FAsuncion&forecast_days=16";
    const res = await fetch(url);
    if (!res.ok) return;
    const data = await res.json();
    if (!data.daily?.time) return;
    weatherData = { dates: data.daily.time, max: data.daily.temperature_2m_max, min: data.daily.temperature_2m_min };
    renderCatCurves();
  }catch(e){ /* sin pronóstico disponible ahora; el resto de las curvas sigue igual */ }
}

function buildCatToggles(){
  const wrap = document.getElementById("cat-toggles");
  wrap.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cat-toggle-btn on";
    btn.innerHTML = `<span class="sw" style="background:${cat.color}"></span>${cat.label}`;
    btn.addEventListener("click", () => {
      if (catActive.has(cat.key)){ catActive.delete(cat.key); btn.classList.remove("on"); }
      else { catActive.add(cat.key); btn.classList.add("on"); }
      renderCatCurves();
    });
    wrap.appendChild(btn);
  });

  const todayBtn = document.createElement("button");
  todayBtn.type = "button";
  todayBtn.className = "cal-today-btn";
  todayBtn.textContent = "Hoy";
  todayBtn.addEventListener("click", () => {
    calRefDate = (today0 >= CAL_MIN && today0 <= new Date(2026, 11, 31))
      ? new Date(today0.getFullYear(), today0.getMonth(), 1)
      : new Date(CAL_MIN);
    renderMonthCalendar();
  });
  wrap.appendChild(todayBtn);
}

function renderCatCurves(){
  const el = document.getElementById("cat-curves");
  const W = 1000;
  const ROW_H = 13, BAR_H = 9, TOP_PAD = 6;
  const year = calRefDate.getFullYear(), month = calRefDate.getMonth();
  const monthStart = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const colW = W / daysInMonth;
  // mismo eje que la fila de días de arriba: columna = día del mes
  const xForDay = dayNum => (dayNum - 1) * colW;
  const todayStr = todayISO();

  let bars = "";
  let bands = "";
  let rowsUsed = 0;

  CATEGORIES.filter(c => c.key !== "clima").forEach(cat => {
    if (!catActive.has(cat.key)) return;
    const catEvents = EVENTS
      .filter(e => e.category === cat.key && e.start <= isoOf(new Date(year, month + 1, 0)) && e.end >= isoOf(monthStart))
      .sort((a,b) => a.start.localeCompare(b.start));
    const bandTop = TOP_PAD - 3 + rowsUsed * ROW_H;
    catEvents.forEach((ev, i) => {
      const y = TOP_PAD + (rowsUsed + i) * ROW_H;
      const evStart = new Date(ev.start + "T00:00:00");
      const evEnd = new Date(ev.end + "T00:00:00");
      // recorta a los límites del mes visible, por si el evento empieza o termina afuera
      const dayFrom = evStart < monthStart ? 1 : evStart.getDate();
      const dayTo = evEnd.getMonth() === month ? evEnd.getDate() : daysInMonth;
      const x1 = xForDay(dayFrom);
      const x2 = xForDay(dayTo) + colW;
      const w = Math.max(x2 - x1 - 2, 4);
      const label = ev.title.length > 22 ? ev.title.slice(0, 20) + "…" : ev.title;
      bars += `<rect x="${x1.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${BAR_H}" rx="${BAR_H/2}" fill="${cat.color}" opacity="0.82"><title>${escapeHTML(ev.title)} (${dLabel(ev.start,{day:"2-digit",month:"short"})}${ev.end!==ev.start ? "–"+dLabel(ev.end,{day:"2-digit",month:"short"}) : ""})</title></rect>`;
      bars += `<text x="${(x1 + w + 5).toFixed(1)}" y="${(y + BAR_H - 1.5).toFixed(1)}" font-size="6.5" font-family="inherit" fill="var(--ink-soft)">${escapeHTML(label)}</text>`;
    });
    const bandBottom = TOP_PAD - 3 + (rowsUsed + catEvents.length) * ROW_H;
    // banda de fondo súper tenue para diferenciar visualmente esta categoría de las demás
    bands = `<rect x="0" y="${bandTop.toFixed(1)}" width="${W}" height="${(bandBottom-bandTop).toFixed(1)}" fill="${cat.color}" opacity="0.05"></rect>` + bands;
    rowsUsed += catEvents.length;
  });

  const H = TOP_PAD + Math.max(1, rowsUsed) * ROW_H + 4;

  // Clima: dato continuo de temperatura, dibujado detrás de todo como una capa bien tenue
  // (mismo eje de días que las barras, para que quede alineado con el resto)
  let climaBg = "";
  if (catActive.has("clima") && weatherData){
    const climaCat = CATEGORIES.find(c => c.key === "clima");
    const idxInMonth = weatherData.dates
      .map((dateStr, i) => ({ dateStr, i }))
      .filter(({dateStr}) => dateStr.startsWith(`${year}-${String(month+1).padStart(2,"0")}`));
    if (idxInMonth.length){
      const avgTemps = idxInMonth.map(({i}) => (weatherData.max[i] + weatherData.min[i]) / 2);
      const tMin = Math.min(...idxInMonth.map(({i}) => weatherData.min[i]));
      const tMax = Math.max(...idxInMonth.map(({i}) => weatherData.max[i]));
      const tRange = Math.max(1, tMax - tMin);
      const tYFor = t => 3 + (1 - (t - tMin) / tRange) * (H - 6);
      const pts = idxInMonth.map(({dateStr}, k) => [xForDay(parseInt(dateStr.slice(8,10), 10)) + colW/2, tYFor(avgTemps[k])]);
      const lineD = smoothPath(pts);
      const areaD = `${lineD} L${pts[pts.length-1][0].toFixed(1)},${H} L${pts[0][0].toFixed(1)},${H} Z`;
      climaBg = `
        <defs><linearGradient id="climaGradBg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${climaCat.color}" stop-opacity="0.10"></stop>
          <stop offset="100%" stop-color="${climaCat.color}" stop-opacity="0"></stop>
        </linearGradient></defs>
        <path d="${areaD}" fill="url(#climaGradBg)"></path>
        <path d="${lineD}" fill="none" stroke="${climaCat.color}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"></path>
      `;
    }
  }

  // cuadrícula: una línea vertical por cada día, alineada con la columna de la fila de arriba
  let gridLines = "";
  for (let d = 1; d <= daysInMonth + 1; d++){
    const x = xForDay(d);
    const isToday = isoOf(new Date(year, month, d)) === todayStr;
    gridLines += `<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${H}" stroke="${isToday ? "var(--ink-faint)" : "#ededed"}" stroke-width="${isToday ? 1 : 0.6}"></line>`;
  }

  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${gridLines}${climaBg}${bands}${bars}</svg>`;
}

buildCatToggles();
renderMonthCalendar();
loadWeather();
</script>
